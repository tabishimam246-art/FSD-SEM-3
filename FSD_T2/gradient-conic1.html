<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .cg1 {
            margin: 30px;
            height: 100px;
            width: 100px;
            background-image: conic-gradient(red, blue, yellow);
        }
        .cg2 {
            margin: 30px;
            height: 100px;
            width: 100px;
            background-image: conic-gradient(red 45deg, blue 90deg, yellow 270deg);
        }
        .cg3 {
            margin: 30px;
            height: 100px;
            width: 100px;
            background-image: conic-gradient(red 0deg 90deg, blue 90deg 180deg, yellow 180deg 270deg, green 270deg 360deg);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class = "cg1"></div>
    <div class = "cg2"></div>
    <div class = "cg3"></div>
</body>
</html>
