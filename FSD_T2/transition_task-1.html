<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a {
            height: 25px;
            width: 100px;
            background-color: tomato;
            transition-duration: 3s;
            transition-delay: 2s;
            transition-property: height, width, background-color;
        }
        .a:hover {
            height: 50px;
            width: 200px;
            background-color: pink;
        }
        .b {
            height: 100px;
            width: 100px;
            background-color: purple;
            transition-property: all;
            transition-duration: 10s;
        }
        .b:hover {
            height: 200px;
            width: 200px;
            background-color: cyan;
            border-radius: 50%;
            transform: rotate(7200deg);
        }
    </style>
</head>
<body>
    <h5> Hover to text box to see effect </h5>
    <form action="index.html" target = "_blank">
        <br><br><label for = "a"> Uname: </label>
        <input class = "a" type="text" id = "a" name = "uname" placeholder="Enter Name"/>
        <br><br><label for = "b"> Password: </label>
        <input class = "a" type = "password" name = "upass" placeholder="password requires"/>
        <br><br><input class = "a" type = "submit"/>
        <input class = "a" type = "reset"/>
    </form>
    <div class = "b"></div>
    <div class = "c"></div>
</body>
</html>
