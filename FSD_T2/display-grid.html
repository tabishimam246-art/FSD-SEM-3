<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .gl {
            display: grid;
            grid-template-columns: 200px 1fr 2fr;
            grid-template-rows: 1fr 2fr;
            gap: 10px;
        }
        .inner {
            background-color: blue;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class = "gl">
        <div class = "inner"> Box A </div>
        <div class = "inner"> Box B </div>
        <div class = "inner"> Box C </div>
        <div class = "inner"> Box D </div>
    </div>
</body>
</html>
