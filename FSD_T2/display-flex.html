<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 15px;
            background-color: light-gray;
            padding: 15px;
        }
        .abc {
            background-color: tomato;
            text-align: center;
            border: 1px solid;
            width: 200px;
        }
    </style>
</head>
<body>
    <div class = "container">
        <div class = "abc"> Box A </div>
        <div class = "abc"> Box B </div>
        <div class = "abc"> Box C </div>
        <div class = "abc"> Box D </div>
    </div>
</body>
</html>
