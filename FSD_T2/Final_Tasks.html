<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .abc {
            height: 200px;
            width: 200px;
            border: 1px solid blue;
            background: conic-gradient(from 90deg, blue 0deg 90deg, green 90deg 180deg, yellow 180deg 270deg, red 270deg 360deg);
            border-radius: 20%;
            transition: height 2s, width 2s, transform 2s;
            animation-name: animate;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
            position: relative;
            top: 150px;
            left: 0px;
        }
        /* .abc:hover {
            /* height: 400px;
            width: 400px; */
            /* transform: rotate(1000deg) translate(50px, 100px); scale(2) increases 2 times the size */
        @keyframes animate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(1000deg) scale(2);
                left: 500px;
            }
        }
    </style>
</head>
<body>
    <div class = "abc"></div>
</body>
</html>
