<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            height: 100px;
            width: 100px;
            background-image: linear-gradient(to right, lightgreen, lightblue, pink);
            background-size: 300% 100%;
            background-position: left;
            transition: background-position 2s;
        }
        .box:hover {
            background-position: right;
        }
    </style>
</head>
<body>
    <div class = "box">Rainbow</div>
</body>
</html>
