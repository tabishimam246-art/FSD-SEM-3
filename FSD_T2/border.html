<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .a {
            border-style: solid;
            border-width: 2px;
            border-color: cyan;
        }
        .b {
            border-style: solid double dashed dotted;
            border-width: 1px 2px 3px 4px;
            border-color: yellow blue green blue;
            border-radius: 20px 10px;
        }
    </style>
</head>
<body>
    <p class = "a"> Hello </p>
    <p class = "b"> How are you? </p>
    <p style = "margin: auto; border: 1px solid red; padding: 50px"> Box 1 </p>
    <p style = "margin: 10px; padding: 100px 50px; border: 2px dotted green"> Box 2 </p>
    <p style = "margin: 100px 10px; border: 2px solid blue"> Box 3 </p>
    <p style = "margin: 50px 20px 100px; border: 1px solid green"> Box 4 </p> 
</body>
</html>
